name: Publish benchmark Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: benchmark-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.11.16
      - name: Install locked benchmark dependencies
        run: uv sync --project benchmark --locked
      - name: Check benchmark and build reviewed aggregates
        working-directory: benchmark
        run: |
          uv run --locked python -m unittest discover -s tests -v
          node --check site/app.js
          uv run --locked python -m dipperbench build-site --approved-results results/latest.json --output runs/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: benchmark/runs/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed benchmark artifact
        id: deployment
        uses: actions/deploy-pages@v4
