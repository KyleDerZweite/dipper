name: Rust and frontend checks
on:
  push:
    branches: [main, feature/raw-voice-to-t3]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libpipewire-0.3-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev ffmpeg
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked -- --test-threads=1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: node --check ui/app.js
      - run: node --check ui/window.js
      - run: node --test tests/ui-window.cjs
      - run: bash -n scripts/*.sh
